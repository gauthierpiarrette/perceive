<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reachability conformance: display:none</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; max-width: 720px; }
    button { padding: 0.5rem 1rem; margin: 0.25rem; font-size: 1rem; }
    .css-hidden { display: none; }
  </style>
</head>
<body>
  <h1>01 &mdash; display:none</h1>
  <p>The button below with <code>display:none</code> must <strong>not</strong> be reported as reachable.</p>
  <button data-bench-id="btn-visible">Visible Button</button>
  <button data-bench-id="btn-hidden" class="css-hidden">Hidden Button</button>

  <script type="application/json" id="ground-truth">
  {
    "page_id": "01_display_none",
    "category": "css_hiding",
    "description": "display:none must not be reachable",
    "elements": [
      { "bench_id": "btn-visible", "role": "button", "name": "Visible Button", "reachable": true },
      { "bench_id": "btn-hidden",  "role": "button", "name": "Hidden Button",  "reachable": false, "reason": "display:none" }
    ]
  }
  </script>
</body>
</html>
