name: Tests

# Runs on every PR and every push to main. Two safety nets:
#   1. Full pytest (unit + smoke + Chromium-backed e2e).
#   2. The reachability benchmark must keep scoring P=R=F1=1.0 — if a change
#      regresses the algorithm, CI fails here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel in-progress runs when a new commit arrives on the same branch / PR.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Playwright Chromium (with system deps)
        run: python -m playwright install --with-deps chromium

      - name: Run pytest (unit + smoke + e2e)
        run: python -m pytest tests/ -v

      - name: Reachability benchmark — must score 1.000
        run: |
          perceive-bench run --adapter perceive --suite reachability
          python <<'PY'
          import json, pathlib, sys
          latest = max(
              pathlib.Path("results").glob("reachability_perceive_*.json"),
              key=lambda p: p.stat().st_mtime,
          )
          summary = json.loads(latest.read_text())["summary"]
          print(f"P={summary['precision']:.3f}  R={summary['recall']:.3f}  F1={summary['f1']:.3f}")
          for k in ("precision", "recall", "f1"):
              if summary[k] != 1.0:
                  sys.exit(f"{k} regressed to {summary[k]}")
          print("Reachability benchmark: clean.")
          PY

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-py${{ matrix.python-version }}
          path: results/*.json
          if-no-files-found: ignore
