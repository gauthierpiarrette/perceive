name: Publish to PyPI

# Triggered when a GitHub Release is published (or manually from the Actions tab).
# Manual dispatch is useful for re-running a publish if it failed partway.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest

    # Required for Trusted Publishing (PyPI mints a short-lived token via OIDC).
    permissions:
      id-token: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      # Fast tests only — unit + bench-smoke. The end-to-end suite needs
      # Chromium and lives in a separate workflow (test.yml).
      - name: Run unit tests
        run: python -m pytest tests/test_perceive_unit.py tests/test_smoke.py -v

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify artifacts
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with:` block — Trusted Publishing reads from the environment + OIDC.
